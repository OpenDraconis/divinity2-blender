schema_version = "1.0.0"

id = "divinity2"
version = "0.3.0"
name = "Divinity II"
tagline = "Import Divinity II: Developer's Cut models and regions"
maintainer = "divinity2-blender contributors"
type = "add-on"

website = "https://github.com/ygalsk/divinity2-blender"

tags = ["Import-Export"]

blender_version_min = "5.2.0"

wheels = [
  "./wheels/nifgen-2026.9.15+dv2-py3-none-any.whl",
  "./wheels/divinity2_lib-0.3.0-py3-none-any.whl",
]

license = ["SPDX:GPL-3.0-or-later"]

# The NIF reader is generated from the NifTools project's format
# specification and bundled as a wheel; the archive and binary-XML reader is
# divinity2-lib, bundled as a wheel the same way.
copyright = [
  "2026 divinity2-blender contributors",
  "2005 NIF File Format Library and Tools contributors",
  "2026 ygalsk (divinity2-lib)",
]

[permissions]
files = "Unpack the game into a folder you choose and read it"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/.claude/",
  "/.gitignore",
  "/CLAUDE.md",
  "/DECISIONS.md",
  "/.agents/",
  "/.codex/",
]
